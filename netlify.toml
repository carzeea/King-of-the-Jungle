# Netlify reads this automatically when the site is linked to this repository.
[build]
  publish = "game"   # the playable site lives in /game
  command = "node scripts/fetch-audio.mjs"   # downloads the labeled sound files into game/audio/

# Let phones cache fighter frames and arena art so repeat visits load fast.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Always check for a newer page and code, so updates (new fighters, art) show right away.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/assets/characters/portraits/*"
  [headers.values]
    Cache-Control = "no-cache"
